name: Docker build check

# Builds the image on pull requests that touch it, without pushing to GHCR or
# archiving to Zenodo (those happen only on release, in docker.yml). Catches a
# broken image before a release mints a DOI for it.
on:
  pull_request:
    paths:
      - Dockerfile
      - pixi.toml
      - pixi.lock
      - .github/workflows/docker-build-check.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
